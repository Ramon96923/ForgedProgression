name: Preview textures
on:
  push:
    branches: [preview-textures]
jobs:
  server-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Boot a dedicated server with the mod
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=DEFAULT\n" > run/server.properties
          gradle runServer --no-daemon > server.log 2>&1 &
          for i in $(seq 1 360); do
            if grep -q "Done (" server.log; then echo "BOOTED"; break; fi
            if grep -qiE "Encountered an unexpected exception|crash report|Failed to start" server.log; then echo "CRASHED"; break; fi
            sleep 1
          done
          sleep 15
          pkill -f runServer || true; pkill -f GradleWorkerMain || true; pkill -f 'net.minecraft' || true
          STATUS=$(grep -q "Done (" server.log && echo booted || echo "did not boot")
          echo "::notice title=status::$STATUS"
          echo "::notice title=done::$(grep -m1 'Done (' server.log | cut -c1-300)"
          echo "::notice title=modloaded::$(grep -m3 -i 'forgedprogression\|Forged Progression' server.log | cut -c1-300 | tr '\n' '|')"
          echo "::notice title=errors::$(grep -iE 'ERROR|Exception|Caused by' server.log | grep -viE 'Unable to download|realms|Could not find any|eula' | head -15 | cut -c1-250 | tr '\n' '|')"
          L=$(grep -n 'Encountered an unexpected exception' server.log | head -1 | cut -d: -f1)
          sed -n "$((L+1)),$((L+40))p" server.log | grep -vE '^\s+at (com.google|sun.reflect|java.lang.reflect|net.minecraftforge.fml.common.(LoadController|Loader|FMLModContainer)|org.apache)' | cut -c1-230 > tail.txt
          split -l 12 tail.txt part_
          for f in part_*; do echo "::notice title=tail-$f::$(tr '\n' '|' < $f)"; done
          echo "::notice title=crash::$(grep -n -iE 'unexpected exception|crash|Failed to start|FATAL' server.log | head -5 | cut -c1-250 | tr '\n' '|')"
          echo "::notice title=hardmode::$(grep -iE 'mob cap|hard mode' server.log | head -3 | cut -c1-250 | tr '\n' '|')"
