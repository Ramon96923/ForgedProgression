name: Preview textures
on:
  push:
    branches: [preview-textures]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -o m.zip https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp_snapshot/20171003-1.12/mcp_snapshot-20171003-1.12.zip
          unzip -o -q m.zip
          echo "::notice title=srg::$(grep -E 'maxNumberOfCreature' fields.csv | tr '\n' ' ')"
