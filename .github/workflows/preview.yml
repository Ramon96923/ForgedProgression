name: Preview textures
on:
  push:
    branches: [preview-textures]
jobs:
  server-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - run: gradle build --no-daemon -q
      - name: Install a real Forge 1.12.2 server and boot it with the mod
        run: |
          J8=$(ls -d /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/8*/x64 | head -1)/bin/java
          mkdir srv && cd srv
          curl -sL -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-installer.jar
          $J8 -jar installer.jar --installServer > install.log 2>&1 || true
          echo "::notice title=install::$(tail -2 install.log | tr '\n' '|')"
          mkdir -p mods && cp ../build/libs/*.jar mods/
          echo "::notice title=modjar::$(ls mods | tr '\n' ' ')"
          echo "eula=true" > eula.txt
          printf "online-mode=false\nmax-tick-time=-1\n" > server.properties
          FORGE=$(ls forge-1.12.2-*.jar | grep -v installer | head -1)
          ( sleep 240; echo stop ) | timeout 300 $J8 -Xmx2G -jar "$FORGE" nogui > server.log 2>&1 || true
          STATUS=$(grep -q "Done (" server.log && echo booted || echo "did not boot")
          echo "::notice title=status::$STATUS"
          echo "::notice title=done::$(grep -m1 'Done (' server.log | cut -c1-200)"
          echo "::notice title=mods::$(grep -m3 -iE 'forgedprogression|Forged Progression' server.log | cut -c1-250 | tr '\n' '|')"
          echo "::notice title=fp-log::$(grep -E '\[Forged Progression\]' server.log | head -10 | cut -c1-250 | tr '\n' '|')"
          echo "::notice title=errors::$(grep -iE 'ERROR|Exception|Caused by' server.log | head -15 | cut -c1-250 | tr '\n' '|')"
          L=$(grep -n 'Encountered an unexpected exception' server.log | head -1 | cut -d: -f1)
          if [ -n "$L" ]; then echo "::notice title=crash::$(sed -n "$((L+1)),$((L+25))p" server.log | cut -c1-230 | tr '\n' '|')"; fi
