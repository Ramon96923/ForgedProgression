name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 8 compiles the mod (toolchain); Java 17 runs Gradle itself.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build mod jar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: forgedprogression-1.12.2
          path: build/libs/*.jar
